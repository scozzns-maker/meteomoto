name: Prova Open-Meteo
on:
  push:
    branches: [test-openmeteo]
jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Coordinate
        run: |
          out=""
          while read -r n; do
            q=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$n")
            r=$(curl -sS "https://geocoding-api.open-meteo.com/v1/search?name=$q&count=3&language=it&countryCode=IT" | python3 -c "import json,sys;d=json.load(sys.stdin);print(' ; '.join('%s %s %.4f %.4f %sm'%(x.get('name'),x.get('admin1'),x['latitude'],x['longitude'],x.get('elevation')) for x in d.get('results',[])))")
            out="$out%0A$n => $r"
          done < names.txt
          echo "::notice title=GEO::$out"
